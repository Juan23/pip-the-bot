<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip</title>
<link rel="stylesheet" href="/base.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
  .avatar { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .who { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  #name { font-size: 15px; font-weight: 600; }
  #status { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  #status svg { flex-shrink: 0; }
  #status-text { overflow: hidden; text-overflow: ellipsis; }
  .btn { height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  main { flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  h2 + * { margin-top: -2px; }
  section + section h2 { margin-top: 8px; }
  section { display: flex; flex-direction: column; gap: 12px; }
  #notices { flex-shrink: 0; max-height: 40%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
  #notices:not(:empty) { padding-top: 12px; }
  .notice { padding: 10px 12px; border-radius: var(--radius); font-size: 13px; border: 1px solid var(--line); background: var(--surface-2); }
  .notice.error { color: var(--danger); border-color: currentColor; background: transparent; overflow-wrap: anywhere; }
  .empty { margin: 0; font-size: 13px; color: var(--muted); }
  .wake { display: flex; gap: 12px; padding: 12px; border-radius: var(--radius); background: var(--surface-2); }
  .wake time { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 1px; white-space: nowrap; }
  .text { min-width: 0; font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
  :is(.text, .bubble, .notice) > :first-child { margin-top: 0; } :is(.text, .bubble, .notice) > :last-child { margin-bottom: 0; }
  :is(.text, .bubble, .notice) :is(p, ul) { margin: 0.5em 0; } :is(.text, .bubble, .notice) ul { padding-left: 1.2em; }
  .chat { display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 80%; padding: 9px 12px; font-size: 13.5px; line-height: 1.4; overflow-wrap: anywhere; }
  .bubble.you { align-self: flex-end; border-radius: 14px 14px 4px 14px; background: var(--accent); color: var(--on-accent); }
  .bubble.bot { align-self: flex-start; border-radius: 14px 14px 14px 4px; background: var(--surface-2); }
  .bubble.you code { color: inherit; }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: 0.2s; } .dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 0.6; } }

  form { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex-grow: 1; min-height: 44px; max-height: 132px; resize: none; padding: 11px 14px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface); line-height: 1.4; }
  .send { width: 44px; height: 44px; flex-shrink: 0; border-radius: var(--radius); border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; }
  .send:disabled { opacity: 0.5; cursor: default; }
  nav { display: flex; justify-content: space-between; padding: 10px 16px 14px; font-size: 13px; }
  nav a { text-decoration: none; } nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="avatar" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 7V4"/><path d="M9 13h.01M15 13h.01"/></svg>
  </div>
  <div class="who">
    <div id="name">Pip</div>
    <div id="status" role="status"><span id="status-icon" aria-hidden="true"></span><span id="status-text">Connecting…</span></div>
  </div>
  <button type="button" class="btn" id="wake" disabled>Wake now</button>
</header>
<div id="notices"></div>
<main id="main">
  <section aria-labelledby="away-h"><h2 id="away-h">While you were away</h2><div id="away"></div></section>
  <section aria-labelledby="chat-h"><h2 id="chat-h">Last chat</h2><div id="chat" class="chat" aria-live="polite"></div></section>
</main>
<form id="composer">
  <label for="msg" class="sr">Message Pip</label>
  <textarea id="msg" rows="1" placeholder="Message Pip…" maxlength="8000"></textarea>
  <button type="submit" class="send" id="send" aria-label="Send">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
</form>
<nav aria-label="Pip's pages">
  <a href="/#memory" id="memory-link">Memory</a>
  <a href="/journal">Activity log</a>
  <a href="/">Open chat window</a>
</nav>
<script type="module">
import { getState, getHistory, getMemory, sendMessage, wakeNow, watch, clock, dayLabel, renderText } from "./api.js";

const $ = (id) => document.getElementById(id);
const ICONS = {
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  term: '<path d="M4 17l6-5-6-5M12 19h8"/>',
  alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
};
const icon = (name) => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

let state = null, history = [], offline = false;
let pending = [], lastSentAt = 0, sendError = null;

// Only touch the DOM when what a part shows changed, so focus, selection and scroll survive polling.
const shown = new Map();
function update(node, key, build) {
  if (shown.get(node) === key) return false;
  shown.set(node, key);
  node.replaceChildren(...build());
  return true;
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.innerHTML = renderText(text); // the only way bot/user text reaches the page
  return n;
}
const when = (iso) => (dayLabel(iso) === "Today" ? "" : dayLabel(iso) + " ") + clock(iso);

function statusLine() {
  if (offline) return ["alert", "Can't reach Pip's server"];
  if (state.busy) return ["dots", "Thinking…"];
  if (state.terminalChat) return ["term", "Chat open in Terminal: messages wait until you close it"];
  if (state.nextWake && state.wakeJob) {
    if (state.nextWake <= Date.now()) return ["moon", "Asleep · wakes in a few minutes"];
    const day = dayLabel(state.nextWake);
    return ["moon", `Asleep · wakes ${day === "Today" ? "" : (day === "Tomorrow" ? "tomorrow" : day) + " "}at ${clock(state.nextWake)}`];
  }
  if (!state.wakeJob) return ["alert", "Background wake-ups aren't installed"];
  return ["moon", "Asleep"];
}

function render() {
  if (state) $("name").textContent = state.name;
  if (state) document.title = state.name;
  const [ic, text] = statusLine();
  update($("status-icon"), ic, () => { const s = document.createElement("span"); s.innerHTML = icon(ic); return [s.firstChild]; });
  $("status-text").textContent = text;
  $("wake").disabled = offline || !state || state.busy;
  $("send").disabled = offline || !state;

  const notices = [];
  if (offline) notices.push(["notice", "Pip's local server isn't answering. The app restarts it automatically; if this doesn't clear, run `bot serve` in a terminal."]);
  if (sendError) notices.push(["notice error", sendError]);
  if (state?.lastError) notices.push(["notice error", `Last run failed (${when(new Date(state.lastError.at).toISOString())}):\n${state.lastError.message}`]);
  update($("notices"), JSON.stringify(notices), () => notices.map(([cls, t]) => {
    const n = el("div", cls, t);
    if (cls.includes("error")) n.setAttribute("role", "alert");
    return n;
  }));

  // "While you were away": replies to the latest wake-ups, newest first.
  const wakes = [];
  history.forEach((item, i) => { if (item.role === "wake" && history[i + 1]?.role === "bot" && history[i + 1].text) wakes.push(history[i + 1]); });
  const away = wakes.slice(-3).reverse();
  update($("away"), JSON.stringify(away) + offline, () => away.length
    ? away.map((r) => {
        const a = document.createElement("article");
        a.className = "wake";
        const t = document.createElement("time");
        t.dateTime = r.at; t.textContent = when(r.at);
        a.append(t, el("div", "text", r.text));
        return a;
      })
    : [Object.assign(document.createElement("p"), { className: "empty", textContent: state || !offline ? "Nothing yet. Pip hasn't woken up on its own." : "Unavailable while the server is down." })]);

  // "Last chat": the latest exchange, or what you just sent while Pip answers.
  let you = [], reply = null;
  if (pending.length) you = pending;
  else {
    const i = history.findLastIndex((h) => h.role === "you");
    if (i >= 0) { you = [history[i].text]; reply = history[i + 1]?.role === "bot" ? history[i + 1] : null; }
  }
  const thinking = pending.length > 0 || Boolean(state?.busy && you.length && !reply);
  const changed = update($("chat"), JSON.stringify([you, reply?.text, thinking]), () => {
    if (!you.length) return [Object.assign(document.createElement("p"), { className: "empty", textContent: "No messages yet. Say hello below." })];
    const nodes = you.map((t) => el("div", "bubble you", t));
    if (reply?.text) nodes.push(el("div", "bubble bot", reply.text));
    if (thinking) {
      const b = el("div", "bubble bot");
      b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span class="sr">Pip is thinking</span>';
      nodes.push(b);
    }
    return nodes;
  });
  if (changed) $("main").scrollTop = $("main").scrollHeight;
}

async function tick() {
  try {
    const [s, h, m] = await Promise.all([getState(), getHistory(60), getMemory()]);
    state = s; history = h; offline = false;
    $("memory-link").textContent = `Memory · ${m.memories.length}`;
    // The reply has arrived (or the run failed) once Pip is idle with something newer than our last send.
    if (pending.length && !s.busy &&
        (h.some((x) => x.role === "bot" && Date.parse(x.at) >= lastSentAt) || (s.lastError && s.lastError.at >= lastSentAt))) pending = [];
  } catch {
    offline = true;
  }
  render();
}

async function send() {
  const text = $("msg").value.trim();
  if (!text || $("send").disabled) return;
  $("msg").value = ""; grow();
  pending.push(text); lastSentAt = Date.now(); sendError = null;
  render();
  try {
    await sendMessage(text);
  } catch (e) {
    pending.pop();
    if (!$("msg").value) { $("msg").value = text; grow(); }
    sendError = `Not sent: ${e.message}`;
  }
  tick();
}

function grow() { const t = $("msg"); t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }
$("msg").addEventListener("input", grow);
$("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });

$("wake").addEventListener("click", async () => {
  $("wake").disabled = true;
  try { await wakeNow(); sendError = null; } catch (e) { sendError = `Couldn't wake Pip: ${e.message}`; }
  tick();
});

// In Bot.app, links open native windows; in a browser they navigate normally.
document.querySelector("nav").addEventListener("click", (e) => {
  const a = e.target.closest("a");
  const native = window.webkit?.messageHandlers?.bot;
  if (!a || !native) return;
  e.preventDefault();
  native.postMessage({ open: a.getAttribute("href") });
});

watch(tick);
</script>
</body>
</html>
